name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            artifact_name: dot-counter-linux
            executable_name: dot-counter
          - os: windows-latest
            artifact_name: dot-counter-windows
            executable_name: dot-counter.exe
          - os: macos-latest
            artifact_name: dot-counter-macos
            executable_name: dot-counter.app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          pyinstaller --noconfirm --windowed --onefile --name dot-counter app.py

      - name: Build with PyInstaller (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          pyinstaller --noconfirm --windowed --onefile --name dot-counter app.py

      - name: Prepare artifact (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cp dist/dot-counter dot-counter-linux
          chmod +x dot-counter-linux
          zip dot-counter-linux.zip dot-counter-linux

      - name: Prepare artifact (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cp dist/dot-counter.exe dot-counter-windows.exe
          Compress-Archive -Path dot-counter-windows.exe -DestinationPath dot-counter-windows.zip

      - name: Prepare artifact (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          # PyInstaller with --windowed --onefile on macOS creates a .app bundle
          # We zip the .app bundle for distribution
          ditto -c -k --sequesterRsrc --keepParent dist/dot-counter.app dot-counter-macos.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dot-counter-linux.zip
            dot-counter-windows.zip
            dot-counter-macos.zip

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: dot-counter-linux
          path: artifacts

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: dot-counter-windows
          path: artifacts

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: dot-counter-macos
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/dot-counter-linux.zip
            artifacts/dot-counter-windows.zip
            artifacts/dot-counter-macos.zip
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
